<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kick Striking 3D</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14;font-family:Arial,sans-serif;touch-action:none}
  #game{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:12px 12px auto;display:flex;gap:12px;justify-content:space-between;pointer-events:none;color:white}
  .fighter{width:44%;max-width:360px;text-shadow:0 2px 4px #000}
  .name{font-weight:900;font-size:14px;margin-bottom:5px;letter-spacing:1px}
  .bar{height:14px;background:#303844;border:2px solid #e8edf5;border-radius:10px;overflow:hidden}
  .fill{height:100%;width:100%;background:linear-gradient(90deg,#31d17c,#a6f26b);transition:width .2s}
  #enemyFill{background:linear-gradient(90deg,#ffb13b,#ff4c4c)}
  #status{position:fixed;top:62px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:clamp(16px,3vw,25px);text-shadow:0 2px 6px #000;pointer-events:none;white-space:nowrap}
  #controls{position:fixed;inset:auto 0 15px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
  #stickArea{width:132px;height:132px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff70;position:relative;pointer-events:auto;touch-action:none}
  #stick{width:54px;height:54px;border-radius:50%;background:#e9f1ffcc;position:absolute;left:37px;top:37px;box-shadow:0 3px 10px #0008}
  #buttons{display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto}
  .action{height:64px;border:2px solid #ffffffaa;border-radius:18px;background:#172235dd;color:white;font-weight:900;font-size:12px;box-shadow:0 4px 12px #0008;touch-action:none}
  .action:active{background:#e34b39;transform:scale(.96)}
  #kick{grid-column:2;background:#b52e2e}
  #restart{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);padding:13px 24px;border:0;border-radius:12px;background:#f2b544;color:#171717;font-weight:900;font-size:16px;display:none}
  #hint{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);color:#fff9;font-size:11px;text-align:center;pointer-events:none}
  @media(max-width:600px){#controls{padding:0 12px}#stickArea{width:118px;height:118px}#stick{left:31px;top:31px}#buttons{grid-template-columns:repeat(2,62px)}.action{height:58px}#hint{bottom:145px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="fighter"><div class="name">PLAYER 1</div><div class="bar"><div id="playerFill" class="fill"></div></div></div>
  <div class="fighter" style="text-align:right"><div class="name">CPU FIGHTER</div><div class="bar"><div id="enemyFill" class="fill"></div></div></div>
</div>
<div id="status">ROUND 1</div>
<div id="hint">Geser joystick untuk bergerak • Serang saat dekat lawan</div>
<div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <div id="buttons">
    <button class="action" id="punch">PUNCH</button>
    <button class="action" id="kick">KICK</button>
  </div>
</div>
<button id="restart">MAIN LAGI</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x9ac4d8);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b8ca);
scene.fog=new THREE.Fog(0x91b8ca,18,38);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);
camera.position.set(0,7.8,12.8);
camera.lookAt(0,1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x586070,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-4,10,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const ringMat=mat(0x244d78), floorMat=mat(0x23435d), ropeMat=mat(0xe9edf1), dark=mat(0x202632);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x667c78));floor.rotation.x=-Math.PI/2;floor.position.y=-.18;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.BoxGeometry(10,.28,10),ringMat);ring.position.y=0;ring.receiveShadow=true;ring.castShadow=true;scene.add(ring);
const matTop=mat(0x3975a0);
const top=new THREE.Mesh(new THREE.PlaneGeometry(9.7,9.7),matTop);top.rotation.x=-Math.PI/2;top.position.y=.151;scene.add(top);
const lineMat=mat(0xffffff);
function barLine(x1,z1,x2,z2,y,color=0xffffff){
 const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
 const m=new THREE.Mesh(new THREE.BoxGeometry(len,.045,.045),mat(color));m.position.set((x1+x2)/2,y,(z1+z2)/2);m.rotation.y=-Math.atan2(dz,dx);scene.add(m);
}
barLine(-4.8,-4.8,4.8,-4.8,.19);barLine(-4.8,4.8,4.8,4.8,.19);
barLine(-4.8,-4.8,-4.8,4.8,.19);barLine(4.8,-4.8,4.8,4.8,.19);
for(let y of [1.0,1.45,1.9]){
 for(let z of [-4.8,4.8]){let r=new THREE.Mesh(new THREE.BoxGeometry(10,.08,.08),ropeMat);r.position.set(0,y,z);scene.add(r)}
 for(let x of [-4.8,4.8]){let r=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,10),ropeMat);r.position.set(x,y,0);scene.add(r)}
}
for(let x of [-4.8,4.8])for(let z of [-4.8,4.8]){let p=new THREE.Mesh(new THREE.BoxGeometry(.18,2.2,.18),mat(0xe7e7e7));p.position.set(x,1.1,z);scene.add(p)}
// Audience silhouettes and simple arena lights
for(let i=0;i<24;i++){let a=new THREE.Mesh(new THREE.BoxGeometry(.35,.6,.35),mat(i%2?0x35404c:0x48515b));a.position.set(-9+(i%12)*1.6,.15,-8-Math.floor(i/12)*1.3);scene.add(a)}

function makeFighter(primary,skin,shorts){
 const g=new THREE.Group();
 const bodyMat=mat(primary),skinMat=mat(skin),shortMat=mat(shorts),gloveMat=mat(0x202020);
 function part(geo,m,x,y,z){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
 part(new THREE.BoxGeometry(.72,.95,.42),bodyMat,0,1.45,0);
 part(new THREE.SphereGeometry(.34,8,6),skinMat,0,2.12,0);
 // hair / headband
 part(new THREE.BoxGeometry(.68,.13,.42),shortMat,0,2.34,0);
 part(new THREE.BoxGeometry(.78,.38,.48),shortMat,0,.82,0);
 const limbs={};
 for(let s of [-1,1]){
  limbs['arm'+s]=part(new THREE.BoxGeometry(.22,.78,.24),skinMat,s*.53,1.48,.02);
  limbs['glove'+s]=part(new THREE.SphereGeometry(.19,8,6),gloveMat,s*.58,1.02,.13);
  limbs['leg'+s]=part(new THREE.BoxGeometry(.27,.78,.3),skinMat,s*.22,.35,0);
  limbs['foot'+s]=part(new THREE.BoxGeometry(.3,.16,.48),gloveMat,s*.22,.08,.12);
 }
 g.userData.limbs=limbs;g.userData.baseY=0;
 scene.add(g);return g;
}
const player=makeFighter(0x2468d8,0xd99b72,0x142c52);
const enemy=makeFighter(0xd94336,0xb97958,0x692222);
player.position.set(-1.5,0,2.3);enemy.position.set(1.5,0,-2.1);
player.rotation.y=0;enemy.rotation.y=Math.PI;
let hpP=100,hpE=100,over=false,attackTimer=0,enemyCooldown=0,hitFlash=0;
const playerFill=document.querySelector('#playerFill'),enemyFill=document.querySelector('#enemyFill'),status=document.querySelector('#status'),restart=document.querySelector('#restart');
function updateHud(){playerFill.style.width=hpP+'%';enemyFill.style.width=hpE+'%'}
function endGame(msg){over=true;status.textContent=msg;restart.style.display='block'}
function attack(who,type){
 if(over)return;
 const target=who===player?enemy:player;
 const dist=who.position.distanceTo(target.position);
 if(dist<2.35){
  if(who===player){hpE=Math.max(0,hpE-(type==='kick'?13:8));}
  else {hpP=Math.max(0,hpP-(type==='kick'?10:6));}
  updateHud();
  target.position.x+=who===player?.18:-.18;
  target.userData.hit=0.18;
  if(hpE<=0)endGame('KAMU MENANG!');if(hpP<=0)endGame('KAMU KALAH!');
 }
 who.userData.attack=type==='kick'?0.42:0.25;
}
document.querySelector('#punch').addEventListener('pointerdown',e=>{e.preventDefault();attack(player,'punch')});
document.querySelector('#kick').addEventListener('pointerdown',e=>{e.preventDefault();attack(player,'kick')});
restart.addEventListener('click',()=>{hpP=hpE=100;updateHud();over=false;restart.style.display='none';status.textContent='ROUND 1';player.position.set(-1.5,0,2.3);enemy.position.set(1.5,0,-2.1)});

let joy={x:0,y:0},activePointer=null;
const area=document.querySelector('#stickArea'),knob=document.querySelector('#stick');
function joyMove(e){
 const r=area.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,lim=36,l=Math.hypot(dx,dy);if(l>lim){dx=dx/l*lim;dy=dy/l*lim}
 joy.x=dx/lim;joy.y=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
area.addEventListener('pointerdown',e=>{activePointer=e.pointerId;area.setPointerCapture(activePointer);joyMove(e)});
area.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)joyMove(e)});
function joyEnd(e){if(e.pointerId===activePointer){activePointer=null;joy={x:0,y:0};knob.style.transform='translate(0,0)'}}
area.addEventListener('pointerup',joyEnd);area.addEventListener('pointercancel',joyEnd);

function animateLimb(f,dt){
 const l=f.userData.limbs;
 if(f.userData.attack>0){f.userData.attack-=dt;l['arm1'].rotation.x=-.8;l['leg1'].rotation.x=-.7}
 else {l['arm1'].rotation.x=0;l['leg1'].rotation.x=0}
 if(f.userData.hit>0){f.userData.hit-=dt;f.position.y=.08}else f.position.y=0;
}
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;
 if(!over){
  const forward=new THREE.Vector3(joy.x,0,-joy.y);
  player.position.x+=forward.x*dt*3.2;player.position.z+=forward.z*dt*3.2;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-4,4);player.position.z=THREE.MathUtils.clamp(player.position.z,-4,4);
  const dx=enemy.position.x-player.position.x,dz=enemy.position.z-player.position.z;
  player.rotation.y=Math.atan2(dx,dz);
  enemy.rotation.y=Math.atan2(-dx,-dz);
  const d=Math.hypot(dx,dz);
  enemyCooldown-=dt;
  if(d>1.55){enemy.position.x-=dx/d*dt*.9;enemy.position.z-=dz/d*dt*.9}
  else if(enemyCooldown<=0){attack(enemy,Math.random()>.55?'kick':'punch');enemyCooldown=1.15+Math.random()*.6}
 }
 animateLimb(player,dt);animateLimb(enemy,dt);
 camera.position.x+=(player.position.x*.22-camera.position.x)*dt*1.5;
 camera.lookAt(player.position.x*.2,1.0,0);
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateHud();
</script>
</body>
</html>
