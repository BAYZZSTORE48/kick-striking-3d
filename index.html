<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BMX Supercross 3D</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game">
<div class="topbar"><div class="brand">BMX <span>SUPERCROSS</span><small>CHAMPIONSHIP</small></div><div class="stats"><div><small>POSISI</small><b id="position">6 / 6</b></div><div><small>KECEPATAN</small><b><span id="speed">0</span><small> KM/H</small></b></div><div><small>WAKTU</small><b id="timer">00:00</b></div></div></div>
<div id="message">BERSIAP!</div><div class="bottom-ui"><div class="steer"><button id="left">◀</button><button id="right">▶</button></div><div class="pedals"><button id="brake" class="secondary">REM</button><button id="jump" class="secondary">LOMPAT</button><button id="gas" class="gas">GAS</button></div></div>
<div id="startScreen" class="overlay"><div class="panel"><div class="eyebrow">3D BMX RACING</div><h1>BMX <span>SUPERCROSS</span></h1><p>Balapan lurus melawan 5 pembalap. Pacu sepeda, lewati ramp, dan rebut posisi pertama!</p><button id="start">MULAI BALAPAN</button><small>TAHAN GAS · ARAHKAN · LOMPAT DI RAMP</small></div></div>
<div id="finishScreen" class="overlay hidden"><div class="panel"><div class="eyebrow">BALAPAN SELESAI</div><h1 id="resultTitle">FINISH!</h1><p id="resultText"></p><button id="restart">BALAP LAGI</button></div></div>
</div><script type="module" src="game.js"></script></body></html>
